name: Ubuntu Noble package

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install packaging tools and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autopkgtest \
            blhc \
            devscripts \
            equivs \
            lintian
          sudo mk-build-deps --install --remove \
            --tool 'apt-get --yes --no-install-recommends' \
            debian/control

      - name: Build source package
        run: |
          source_name="$(dpkg-parsechangelog --show-field Source)"
          package_version="$(dpkg-parsechangelog --show-field Version)"
          upstream_version="${package_version%-*}"
          git archive --format=tar \
            --prefix="${source_name}-${upstream_version}/" \
            HEAD -- . ':(exclude)debian' ':(exclude).github' \
            | gzip --no-name > "../${source_name}_${upstream_version}.orig.tar.gz"
          dpkg-buildpackage --no-sign --build=source

      - name: Build binary packages
        run: |
          dpkg-buildpackage --no-sign --build=binary 2>&1 | tee ../build.log

      - name: Check hardening flags
        run: blhc --all --debian ../build.log

      - name: Run Lintian
        run: lintian --fail-on error --display-info --pedantic ../emwm_*.changes

      - name: Run autopkgtests
        run: sudo autopkgtest . ../emwm_*_amd64.deb -- null

      - name: Collect packages and build metadata
        if: always()
        run: |
          mkdir -p artifacts
          find .. -maxdepth 1 -type f -name 'emwm*' \
            -exec cp -- {} artifacts/ \;

      - name: Upload packages and build metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: emwm-noble-${{ github.sha }}
          path: artifacts/
